# BoreDefi alerts Worker. NOT deployed. Nothing here is secret.
# Secrets are set with `npx wrangler secret put NAME` (see README.md), never written in this file.
name = "boredefi-alerts"
main = "worker.ts"
compatibility_date = "2026-11-01"
# The Worker imports shared wallet modules that read process.env (empty here); nodejs_compat provides `process`.
compatibility_flags = ["nodejs_compat"]

[triggers]
# Every 5 minutes: EVM polling + address syncs. Price checks run every PRICE_CHECK_MINUTES (default 10).
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "boredefi-alerts"
# Filled in after `npx wrangler d1 create boredefi-alerts` (free). Placeholder until then.
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
PRICE_CHECK_MINUTES = "10"
HELIUS_SYNC_MINUTES = "60"
POLL_CHAIN_IDS = "10,56,43114"
# NETWORK=webhookId pairs after the 5 free Alchemy webhooks are created, e.g.
# "ETH_MAINNET=wh_...,BASE_MAINNET=wh_...,APECHAIN_MAINNET=wh_...,ARB_MAINNET=wh_...,MATIC_MAINNET=wh_..."
ALCHEMY_WEBHOOKS = ""
HELIUS_WEBHOOK_ID = ""
PUBLIC_BASE_URL = ""
